name: Shader package

on:
  push:
    branches: [dev]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify tag and package matching validated sources
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          config = json.loads(Path('release.json').read_text())
          if os.environ['REF_TYPE'] == 'tag':
              assert os.environ['REF_NAME'] == config['tag'], 'Tag/release.json mismatch'
          PY
          python3 scripts/build_release.py --output-dir dist
      - name: Upload checked shader ZIP and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Revelation-RT-v9.3-LightControls
          path: dist/*
          if-no-files-found: error
